<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Divya Trading Co.</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-login-body">

  <div class="admin-login-card">
    <div class="login-brand" style="text-align: center; margin-bottom: 24px;">
      <div style="display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
        <img src="{{ url_for('static', filename='images/dtc_emblem.png') }}" alt="Divya Trading Co." style="height: 60px; width: 60px; border-radius: 50%; box-shadow: 0 4px 12px rgba(10,37,64,0.15);">
      </div>
      <h2 style="font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 800; color: #0A2540; margin: 0; letter-spacing: 0.5px;">DIVYA TRADING CO.</h2>
      <p style="font-size: 0.78rem; font-weight: 700; color: #0052CC; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px;">Management Control Portal</p>
    </div>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="admin-flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('admin_login') }}" method="POST" autocomplete="on">
      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label" style="font-weight: 600; color: #1E293B;">Administrator Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter username" autocomplete="username" required autofocus style="padding: 11px 14px; font-size: 0.92rem;">
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" style="font-weight: 600; color: #1E293B;">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required style="padding: 11px 14px; font-size: 0.92rem;">
      </div>

      <button type="submit" class="btn-admin-primary" style="width: 100%; justify-content: center; padding: 13px; font-size: 0.95rem; font-weight: 700;">
        <span>Sign In to Admin Panel</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left: 6px;"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center; border-top: 1px solid #E2E8F0; padding-top: 16px;">
      <a href="{{ url_for('home') }}" style="color: #64748B; font-size: 0.82rem; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Return to Live Website</span>
      </a>
    </div>
  </div>

</body>
</html>
